<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Pedidos/principal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Login Admin</title>
</head>
<body>

    <!--card-->
    <div class="d-flex justify-content-center align-items-center vh-100">

        
    <div class="card w-25 p-4 text-white" style=" background-color: rgba(0, 0, 0, 0.5); ">
       
        <div class="card-body ">
          <h5 class="card-title d-flex justify-content-center align-items-center fs-3 mb-4">Log in</h5>
          <form>

            <div class="input-group mb-3">
                <span class="input-group-text bg-transparent text-white border-0">
                    <i class="bi bi-person-fill"></i>
                </span>
              <input type="email" class="form-control rounded-4" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Username" >
            </div>


            <div class="input-group mb-3">
              <span class="input-group-text bg-transparent text-white border-0">
                <i class="bi bi-lock-fill"></i>
              </span>
              <input type="password" class="form-control rounded-4" id="exampleInputPassword1" placeholder="password">
            </div>

            <div class=" d-grid d-flex justify-content-center align-items-center mb-2">

            <button type="button" class="btn btn-outline-dark w-50 rounded-pill text-white">iniciar</button>
            </div>

            <a href="/Pedidos/principal.html">
              <span  class="d-flex justify-content-center align-items-center">
                volver
              </span>
            </a>
           
          </form>
        </div>
      </div>
    
    </div>
</body>
</html>
