    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Realizar pedido</title>
</head>
<body >


   <!--barra de navegacion-->


   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/index.html">Inicio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                
                <li class="nav-item"><a class="nav-link" href="/Nosotros.html">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos/productos.html">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="/Pedidos/principal.html" target="_blank">Realizar Pedidos</a></li>
            </ul>

            <!--icono-->
            <div class="d-flex ms-auto me-10">
                <a href="/Pedidos/admin/admin.login.html">
                    <i class="bi bi-person fs-4 text-white"></i>
                </a>
                
            </div>
        </div>
    </div>
  </nav>

    <!--card-formulario-->
    <div class="d-flex justify-content-center align-items-center vh-100">
        
    <div class="card w-50 text-white" style=" background-color: rgb(0, 0, 0, 0.7); ">
        <div class="card-body">
            <b><h5 class="card-title mt-3 d-flex justify-content-center align-items-center">Realizar pedido</h5></b>
            <br>
    
            <form action="/procesar_pedido" method="POST">
               
    
    
                <!-- Nombre -->
                
                <input class="form-control custom-input mb-4" type="text" id="nombre" name="nombre" placeholder="Nombre" required>
    
                <!-- Teléfono -->
               
                <input class="form-control custom-input mb-4" type="tel" id="telefono" name="telefono" placeholder="Teléfono" required>
    
                <!-- Dirección -->
             
                <input class="form-control custom-input mb-4" type="text" id="direccion" name="direccion" placeholder="Dirección" required>
    
                
                <!-- Seleccionar los pedidos -->
                <select class="form-select mt-2" aria-label="Default select example" id="pedido" name="pedido" required>
                    <option value="Productos">Productos</option>
                    <option value="hamburguesa">Hamburguesa</option>
                    <option value="pizza">Pizza</option>
                    <option value="hotdog">Hot Dog</option>
                    <option value="papas">Papas Fritas</option>
                    <option value="bebida">Bebida</option>
                </select>


                <label class="mt-2" for="pago">Método de Pago:</label>
                <select class="form-select mt-2 mb-4" aria-label="Default select example" id="pago" name="pago" required>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                </select>

                <div class="d-flex justify-content-center align-items-center">
                <button type="button" class="btn btn-outline-dark w-50 rounded-pill text-white mb-4">Enviar</button>
                </div>
            </form>
        </div>
    </div>
    
    </div>
</body>
</html>
