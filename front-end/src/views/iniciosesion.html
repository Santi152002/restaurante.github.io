<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrador</title>
  <link rel="icon" href="/front-end/public/imagesGlobal/logo principal2.png" type="image/png">
  <link rel="stylesheet" href="/front-end/src/assets/iniciosesion.css" />
</head>

<body>
  <section>
    <div class="login-box">
      <form action="">
        <h2>Login</h2>
        <div class="input-box">
          <span class="icon"><ion-icon name="person"></ion-icon></span>
          <input type="Usuario" required />
          <label>Usuario</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" required />
          <label>Contraseña</label>
        </div>
        <button type="submit">Iniciar sesion</button>
      </form>
    </div>
  </section>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/front-end/src/script/sesion.js"></script>
</body>

</html>
