  <!-- Aqui finaliza la barra superior -->
  <h3 class="titulo">ADMINISTRACION DE EMPLEADOS</h3>

  <div class="opcionesmenu1">
    <div class="empleados">
      <span contenteditable="false" class="nombre-empleado">NOMBRE DE EMPLEADO</span>
      <div class="iconos">
        <a href="#" class="abrir-editar" data-id="1">
          <ion-icon name="person-outline"></ion-icon>
        </a>
        <a href="#" class="abrir-eliminar" data-id="1">
          <ion-icon name="trash-outline"></ion-icon>
        </a>
      </div>
    </div>
  </div>

    
      

  <div class="guardar">
    <ul>
      <li><a href="#" id="abrirModalCrear">CREAR USUARIO DE EMPLEADO</a></li>
    </ul>
  </div>
  <!-- Ventanas flotantes para el humano-->
  <div class="modal" id="modalEditar">
    <div class="modal-contenido">
      <span class="cerrar cerrar-editar">&times;</span>
      <h2>Editar Información del Empleado</h2>
      <form id="formEditar">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre">
  
        <label for="correo">Nombre de usuario</label>
        <input type="text" id="text" name="correo">
  
        <label for="rol">Contraseña:</label>
        <input type="password" id="contraseña" name="rol">

        <label for="rol">Rol</label>
        <input type="text" id="rol" name="rol">
  
        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>
  
  <!-- Ventanas flotantes para borrar-->

  <div class="modal" id="modalEliminar">
    <div class="modal-contenido">
      <span class="cerrar cerrar-eliminar">&times;</span>
      <h2>¿Estás seguro de eliminar al empleado?</h2>
      <button id="confirmarEliminar">Sí, eliminar</button>
    </div>
  </div>
  
  <div id="modalCrear" class="modal">
    <div class="modal-contenido">
      <span class="cerrar" id="cerrarModalCrear">&times;</span>
      <h2>Crear Usuario de Empleado</h2>
      <form id="formCrearEmpleado">
        <input type="text" placeholder="Nombre completo" id="nombreCompleto" required><br>
        <input type="text" placeholder="Nombre de usuario" id="nombreUsuario" required><br>
        <input type="password" placeholder="Contraseña" id="contrasena" required><br>
        <input type="text" placeholder="Rol" id="rol" required><br><br>
        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>
